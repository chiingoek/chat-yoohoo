<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YooHoo Chat | Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008cff;
            --primary-glow: rgba(0, 140, 255, 0.4);
            --bg: #050505;
            --surface: #111;
            --text: #e0e0e0;
            --accent-glow: rgba(255, 77, 77, 0.35);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #001a33 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .maintenance-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: var(--surface);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #ff4d4d;
            box-shadow: 0 0 40px var(--accent-glow);
            width: 420px;
            max-width: 90vw;
            text-align: center;
            position: relative;
        }
        h2 {
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ff4d4d;
            text-shadow: 0 0 12px var(--accent-glow);
            margin-top: 0;
            font-size: 1.6em;
        }
        .sub-text {
            font-size: 0.85em;
            color: #888;
            margin: 20px 0 0;
            line-height: 1.6;
            letter-spacing: 1px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #ff4d4d;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="maintenance-overlay">
    <div class="card">
        <h2><span class="status-dot"></span>Repairs Ongoing</h2>
        <p class="sub-text">Check back soon to discover all the secrets of Yoohoo chat</p>
    </div>
</div>

</body>
</html>
